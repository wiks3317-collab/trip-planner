<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 不讓搜尋引擎收錄本站（Google、Bing 等都會遵守） -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
<title>旅行行程規劃工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%96%EF%B8%8F</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="bg-image-layer"></div>

  <!-- 頂部列 -->
  <header id="app-header">
    <button id="menu-toggle-btn" class="icon-btn" title="行程選單">☰</button>
    <div id="header-title">
      <span id="header-trip-name">旅行行程規劃工具</span>
      <button id="rename-trip-btn" class="icon-btn hidden" title="重新命名行程" style="font-size:13px;">✏️</button>
    </div>
    <div id="header-actions">
      <button id="current-member-badge" class="hidden" title="目前身份"></button>
      <button id="appearance-btn" class="icon-btn" title="外觀設定">🎨</button>
      <button id="share-btn" class="icon-btn hidden" title="分享此行程">🔗</button>
    </div>
  </header>

  <!-- 左側行程選單（抽屜） -->
  <div id="menu-overlay" class="hidden"></div>
  <aside id="trip-menu" class="hidden">
    <div class="menu-header">
      <h3>我的行程</h3>
      <button id="menu-close-btn" class="icon-btn">✕</button>
    </div>
    <ul id="trip-list"></ul>
    <button id="new-trip-btn" class="primary-btn full-width">＋ 建立新行程</button>
    <div class="menu-footer">
      <button id="join-trip-btn" class="secondary-btn full-width">用邀請連結加入行程</button>
      <button id="sync-devices-btn" class="secondary-btn full-width" style="margin-top:8px;">🔄 跨裝置同步清單</button>
      <button id="show-uid-btn" class="secondary-btn full-width" style="margin-top:8px;">🪪 顯示目前裝置 UID</button>
      <a id="admin-link-btn" href="admin.html" target="_blank" rel="noopener" class="secondary-btn full-width" style="display:block;box-sizing:border-box;margin-top:8px;text-align:center;text-decoration:none;">🛠️ 管理員後台</a>
    </div>
  </aside>

  <!-- 主要內容區 -->
  <main id="app-root">
    <div id="loading-screen">
      <p>載入中...</p>
    </div>
  </main>

  <!-- 通用 Modal 容器 -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box"></div>
  </div>

  <!-- 景點詳細面板（彈出式，取代整頁跳轉） -->
  <div id="spot-panel-overlay" class="hidden">
    <div id="spot-panel-box">
      <div id="spot-panel-header">
        <button id="spot-panel-close" class="icon-btn" title="關閉">← 返回</button>
        <span id="spot-panel-header-title"></span>
      </div>
      <div id="spot-panel-content"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast-container"></div>

  <!-- v21p3 Fix 3：使用單一標準 module 入口；Firebase 初始化可安全重用既有 app。 -->
  <script>
    window.addEventListener("error", (event) => {
      console.error("[runtime]", event.error || event.message);
      const root = document.getElementById("app-root");
      if (!root || root.dataset.runtimeErrorShown === "1") return;
      root.dataset.runtimeErrorShown = "1";
      root.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px;"><h3 style="margin-top:0;">⚠️ 網站程式載入失敗</h3><p style="color:var(--text-muted);">程式初始化時發生錯誤。</p><p style="font-size:12px;color:var(--text-muted);word-break:break-word;">${String(event.error?.message || event.message || "未知錯誤").replace(/</g,"&lt;")}</p><button class="primary-btn" onclick="location.reload()">重新整理</button></div>`;
    });
    window.addEventListener("unhandledrejection", (event) => {
      console.error("[unhandledrejection]", event.reason);
    });
  </script>
  <script type="module" src="app.js?v=21p3fix3"></script>
</body>
</html>
