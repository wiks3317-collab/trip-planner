<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<!-- v21p5：CSP 縱深防禦。若日後新增外部資源被擋，請看瀏覽器主控台的 CSP 錯誤並在此放行；緊急時可整行移除。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://cdn.jsdelivr.net https://*.currency-api.pages.dev https://www.google.com; frame-src https://www.google.com https://recaptcha.google.com https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- v21p6：離線支援（PWA）。manifest 讓手機可「加到主畫面」；sw.js 讓網站本身在斷網時也能打開。 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0E6B64" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- 不讓搜尋引擎收錄本站（Google、Bing 等都會遵守） -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
<title>旅行行程規劃工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%96%EF%B8%8F</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="bg-image-layer"></div>

  <!-- 頂部列 -->
  <header id="app-header">
    <button id="menu-toggle-btn" class="icon-btn" title="行程選單">☰</button>
    <div id="header-title">
      <span id="header-trip-name">旅行行程規劃工具</span>
      <button id="rename-trip-btn" class="icon-btn hidden" title="重新命名行程" style="font-size:13px;">✏️</button>
    </div>
    <div id="header-actions">
      <button id="sync-status-btn" class="sync-pill hidden" title="離線與同步狀態"></button>
      <button id="current-member-badge" class="hidden" title="目前身份"></button>
      <button id="appearance-btn" class="icon-btn" title="外觀設定">🎨</button>
      <button id="share-btn" class="icon-btn hidden" title="分享此行程">🔗</button>
    </div>
  </header>

  <!-- 左側行程選單（抽屜） -->
  <div id="menu-overlay" class="hidden"></div>
  <aside id="trip-menu" class="hidden">
    <div class="menu-header">
      <h3>我的行程</h3>
      <button id="menu-close-btn" class="icon-btn">✕</button>
    </div>
    <ul id="trip-list"></ul>
    <button id="new-trip-btn" class="primary-btn full-width">＋ 建立新行程</button>
    <div class="menu-footer">
      <button id="join-trip-btn" class="secondary-btn full-width">用邀請連結或代碼加入行程</button>
      <button id="sync-devices-btn" class="secondary-btn full-width" style="margin-top:8px;">🔄 跨裝置同步清單</button>
      <button id="offline-panel-btn" class="secondary-btn full-width" style="margin-top:8px;">📴 離線與同步</button>
      <button id="show-uid-btn" class="secondary-btn full-width" style="margin-top:8px;">🪪 顯示目前裝置 UID</button>
      <a id="admin-link-btn" href="admin.html" target="_blank" rel="noopener" class="secondary-btn full-width" style="display:block;box-sizing:border-box;margin-top:8px;text-align:center;text-decoration:none;">🛠️ 管理員後台</a>
    </div>
  </aside>

  <!-- 主要內容區 -->
  <main id="app-root">
    <div id="loading-screen">
      <p>載入中...</p>
    </div>
  </main>

  <!-- 通用 Modal 容器 -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box"></div>
  </div>

  <!-- 景點詳細面板（彈出式，取代整頁跳轉） -->
  <div id="spot-panel-overlay" class="hidden">
    <div id="spot-panel-box">
      <div id="spot-panel-header">
        <button id="spot-panel-close" class="icon-btn" title="關閉">← 返回</button>
        <span id="spot-panel-header-title"></span>
      </div>
      <div id="spot-panel-content"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast-container"></div>

  <script src="boot.js?v=21p7"></script>
</body>
</html>
